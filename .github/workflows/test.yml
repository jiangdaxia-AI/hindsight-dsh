name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v4
      with:
        version: '11'

    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Before anything is built: prove the vendored runtime is the copy this repo pinned, and that
    # its import boundary is still closed. A hand-edited or half-synced vendor tree otherwise fails
    # later as a confusing typecheck or bundling error.
    - name: Check the vendored runtime
      run: pnpm run check-runtime

    - name: Typecheck
      run: pnpm run typecheck

    - name: Unit tests
      run: pnpm test

    - name: Build both halves
      run: pnpm run build

    # The build already refuses to emit a bundle whose packages are undeclared (see
    # scripts/build.mjs). This is the packaging contract on top: everything the manifest tells a
    # profile to load has to exist, be inside `files`, and be reachable by the runtime — including
    # the entries it spawns by path, which no import graph would reveal.
    - name: Contract check against a real dsh profile
      run: pnpm run check-contract
